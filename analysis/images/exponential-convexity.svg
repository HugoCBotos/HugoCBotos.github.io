<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500" role="img" aria-labelledby="title desc">
  <title id="title">Convexity of the exponential</title>
  <desc id="desc">The graph of y equals e to the x and the chord between a equals minus one and b equals one. At s equals t equals one half, the chord lies above the curve.</desc>
